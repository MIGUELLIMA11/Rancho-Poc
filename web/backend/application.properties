# ================================================================
#  RANCHO COMANCHE — Spring Boot Application Properties
#  Copiar para:  src/main/resources/application.properties
# ================================================================

# ── Servidor ────────────────────────────────────────────────────
server.port=8080

# ── Datasource (MySQL) ──────────────────────────────────────────
# Criar o banco antes: CREATE DATABASE rancho_comanche;
spring.datasource.url=jdbc:mysql://localhost:3306/rancho_comanche?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=sua_senha_aqui
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ─────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# ── JWT ─────────────────────────────────────────────────────────
# IMPORTANTE: troque por uma string longa e aleatória em produção!
jwt.secret=RanchoComancheSecretKey2025SuperSegura!@#$%
jwt.expiration=86400000
# 86400000 ms = 24 horas

# ── Jackson (serialização de datas) ─────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Sao_Paulo

# ── Logs ────────────────────────────────────────────────────────
logging.level.com.rancho=DEBUG
logging.level.org.springframework.security=DEBUG

# ── E-mail (para recuperação de senha) ─────────────────────────
# Usando Gmail SMTP — ative "Senhas de app" na conta Google
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=seuemail@gmail.com
spring.mail.password=sua_senha_de_app_google
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

