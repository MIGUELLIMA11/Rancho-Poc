services:
  - type: web
    name: rancho-comanche-api
    runtime: java
    rootDir: backend/projeto-rancho
    buildCommand: chmod +x mvnw && ./mvnw clean package -DskipTests
    startCommand: java -jar target/projeto-rancho-0.0.1-SNAPSHOT.jar
    plan: free

    envVars:
      - key: JWT_SECRET
        generateValue: true          # Render gera automaticamente um valor seguro

      - key: H2_CONSOLE_ENABLED
        value: "false"               # Desabilitado em produção

      - key: APP_FRONTEND_URL
        value: https://miguellima11.github.io/Rancho-Poc
